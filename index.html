<script>
  function createBoxes() {
    const boxes = [];
    for (let i = 0; i < 2; i++) {
      const box = document.createElement("div");
      box.classList.add("box");
      document.body.appendChild(box);
      boxes.push(box);
    }

    const firstName = document.getElementById("first-name");
    const lastName = document.getElementById("last-name");

    boxes[0].style.left = firstName.offsetLeft + "px";
    boxes[0].style.top = firstName.offsetTop + "px";
    boxes[0].style.width = firstName.offsetWidth + "px";
    boxes[0].style.height = firstName.offsetHeight + "px";
    boxes[1].style.left = lastName.offsetLeft + "px";
    boxes[1].style.top = lastName.offsetTop + 40 + "px";
    boxes[1].style.width = lastName.offsetWidth + "px";
    boxes[1].style.height = lastName.offsetHeight - 40 + "px";

    return boxes;
  }

  const boxes = createBoxes();
  const dot = document.getElementById("dot");
  const trails = document.getElementsByClassName("trail");
  for (let i = 0; i < trails.length; i++) {
    trails[i].style.transform = `scale(${Math.max(0.5, 1 - i * 0.05)})`;
    // trails[i].style.opacity = 1 - i * 0.05;
    trails[i].style.opacity = 0;
  }

  //   let x = 210;
  //   let y = 400;
  //   let x = boxes[0].offsetLeft - 100;
  //   let y = boxes[0].offsetTop - 200;
  let x = getLinesForBox(boxes[0])[0].x1 - 110;
  let y = getLinesForBox(boxes[0])[0].y1 - 100;
  console.log("Starting ball position:", { x, y });
  let vx = 4;
  let vy = -7;
  let ay = 0.3;
  let lastTimestamp = 0;
  let bounces = 0;
  let frameTime = 1000 / 60;
  const BOUNCE_LIMIT = 4;

  function runAnimation(timestamp) {
    animateDot(timestamp);
  }
  setInterval(() => {
    runAnimation();
  }, frameTime);

  function animateDot(timestamp = 0) {
    for (let i = trails.length - 1; i >= 1; i--) {
      trails[i].style.left = trails[i - 1].style.left;
      trails[i].style.top = trails[i - 1].style.top;
    }
    trails[0].style.left = x + "px";
    trails[0].style.top = y + "px";

    x += (vx * frameTime) / 10;
    y += (vy * frameTime) / 10;
    vy += (ay * frameTime) / 10;
    checkForBounce();
    // if (y >= 400) {
    //   vy = -vy;
    //   applyBounceFriction();
    //   y = 400;
    //   bounces++;
    //   if (bounces >= 4) {
    //     vy = 0;
    //   }
    // }
    // if (x >= 1000 || x <= 0) {
    //   vx = -vx;
    //   x = x >= 1000 ? 1000 : 0;
    // }
    dot.style.left = x + "px";
    dot.style.top = y + "px";

    lastTimestamp = timestamp;
  }

  function checkForBounce() {
    const line = findIntersectingLine();
    if (line) {
      if (bounces >= BOUNCE_LIMIT - 1) {
        vx = 0;
        vy = 0;
        return;
      }
      console.log("Intersected with line:", line);
      console.log("Ball position and speed:", { x, y, vx, vy });

      applyBounceVelocity(line);
      moveToPointOfIntersection(line);
      applyBounceFriction();
      bounces++;
    }
  }

  function moveToPointOfIntersection(line) {
    const isVerticalLine = line.x1 === line.x2;
    if (isVerticalLine) {
      if (vx > 0) {
        x = line.x1 + 10;
      } else {
        x = line.x1 - 10;
      }
    } else {
      if (vy > 0) {
        y = line.y1 + 10;
      } else {
        y = line.y1 - 10;
      }
    }
    // const angle = Math.atan2(line.y2 - line.y1, line.x2 - line.x1);
    // const ix = line.x1 + Math.cos(angle) * 5;
    // const iy = line.y1 + Math.sin(angle) * 5;
    // x = ix;
    // y = iy;
  }

  function applyBounceVelocity(line) {
    const isVertical = line.x1 === line.x2;
    if (isVertical) {
      vx = -vx;
    } else {
      vy = -vy;
    }
    // const angle = Math.atan2(line.y2 - line.y1, line.x2 - line.x1);
    // const newVx = Math.cos(angle) * vy;
    // const newVy = Math.sin(angle) * vy;
    // vx = newVx;
    // vy = newVy;
  }

  function applyBounceFriction() {
    vy = vy * 0.7;
    vx = vx * 0.7;
  }

  function findIntersectingLine() {
    for (let i = 0; i < boxes.length; i++) {
      const box = boxes[i];
      const lines = getLinesForBox(box);
      for (let j = 0; j < lines.length; j++) {
        const line = lines[j];
        if (isIntersecting(line, x, y, vx, vy)) {
          return line;
        }
      }
    }
    return null;
  }

  function isIntersecting(line, x, y, vx, vy) {
    const dx = x - line.x1;
    const dy = y - line.y1;
    const dot = dx * (line.x2 - line.x1) + dy * (line.y2 - line.y1);
    const len2 =
      (line.x2 - line.x1) * (line.x2 - line.x1) +
      (line.y2 - line.y1) * (line.y2 - line.y1);
    const t = dot / len2;
    if (t < 0 || t > 1) {
      return false;
    }
    const ix = line.x1 + t * (line.x2 - line.x1);
    const iy = line.y1 + t * (line.y2 - line.y1);
    const dist = Math.sqrt((ix - x) * (ix - x) + (iy - y) * (iy - y));
    return dist < 10;
  }

  function getLinesForBox(box) {
    const lines = [];
    lines.push({
      x1: box.offsetLeft,
      y1: box.offsetTop,
      x2: box.offsetLeft + box.offsetWidth,
      y2: box.offsetTop,
    });
    lines.push({
      x1: box.offsetLeft,
      y1: box.offsetTop,
      x2: box.offsetLeft,
      y2: box.offsetTop + box.offsetHeight,
    });
    lines.push({
      x1: box.offsetLeft + box.offsetWidth,
      y1: box.offsetTop,
      x2: box.offsetLeft + box.offsetWidth,
      y2: box.offsetTop + box.offsetHeight,
    });
    lines.push({
      x1: box.offsetLeft,
      y1: box.offsetTop + box.offsetHeight,
      x2: box.offsetLeft + box.offsetWidth,
      y2: box.offsetTop + box.offsetHeight,
    });
    return lines;
  }

  runAnimation();
  //   console.log({ lines: getLinesForBox(boxes[0]) });
  //   console.log({ rect: boxes[0].getBoundingClientRect() });
</script>
