<meta charset="UTF-8" />
<script
  src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"
  integrity="sha512-6+7rTBmR6pRFe9fa0vCFjFaHZj/XYa7774bEBzRtxgdpIJOS++R3cKd6Prg/eJmxtsJotd8KAg4g57uuVQsZKA=="
  crossorigin="anonymous"
  referrerpolicy="no-referrer"
  defer
></script>

<style>
  body {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100%;
    font-family: sans-serif;
    background: #222;
    color: #eee;

    font-size: 3em;
  }

  a {
    color: #aaf;
    text-decoration: none;
  }

  #canvas-container {
    position: absolute;
    top: 0;
    left: 0;
    z-index: -10;
    margin-left: -200px;
    margin-top: -200px;
  }

  .name-container {
    position: relative;
  }

  .name {
    top: 50%;
    left: 50%;
    color: white;
  }
  .collision {
    position: absolute;
    display: none;
    left: 0;
    top: 0;
    z-index: -1;
  }
</style>
<body>
  <div class="name-container">
    <img src="./name.svg" class="name" />
    <div id="canvas-container"></div>
  </div>

  <h3>
    <a href="/rent-vs-buy-calculator/">Sydney - Rent vs Buy calculator</a>
  </h3>
</body>

<script>
  const runSimulation = async () => {
    const { Body, Engine, Render, Runner, Bodies, Composite } = Matter;
    var engine = Engine.create();

    const nameContainer = document.querySelector(".name-container");
    var render = Render.create({
      element: document.getElementById("canvas-container"),
      engine: engine,
      options: {
        width: nameContainer.clientWidth + 400,
        height: nameContainer.clientHeight + 400,
        wireframes: false,
        background: "rgba(0,0,0,0)",
      },
    });
    Render.lookAt(render, {
      bounds: {
        min: { x: -200, y: -200 },
        max: {
          x: nameContainer.clientWidth + 200,
          y: nameContainer.clientHeight + 200,
        },
      },
    });

    var circle = Bodies.circle(204, -50, 8, {
      render: { fillStyle: "white" },
    });
    circle.restitution = 0;
    Body.applyForce(
      circle,
      circle.position,
      Matter.Vector.create(0.005, -0.01),
    );

    const boxes = await createBoxes();
    var ground = Bodies.rectangle(400, 610, 810, 60, { isStatic: true });

    // add all of the bodies to the world
    Composite.add(engine.world, [circle, ...boxes, ground]);

    Render.run(render);
    var runner = Runner.create({ delta: 1000 / 120 });

    // Added incase we want to delay the start of the animation
    window.setTimeout(() => Runner.run(runner, engine), 0);

    async function createBoxes() {
      const svg = await fetch("collision.svg", { cache: "force-cache" });
      const svgDom = new DOMParser().parseFromString(
        await svg.text(),
        "image/svg+xml",
      );
      const rects = svgDom.querySelectorAll("rect");
      const bodies = [...rects].map((rect) => {
        // debugger;
        const body = Bodies.rectangle(
          Number(rect.attributes["x"].value) +
            Number(rect.attributes["width"].value) / 2,
          Number(rect.attributes["y"].value) +
            Number(rect.attributes["height"].value) / 2,
          Number(rect.attributes["width"].value),
          Number(rect.attributes["height"].value),
          {
            isStatic: true,
            render: {
              strokeStyle: "none",
              lineWidth: 0,
              fillStyle: "rgba(0,0,0,0)",
            },
          },
        );
        const extraProps = JSON.parse(
          rect.querySelector("desc")?.innerHTML || "{}",
        );
        body.restitution = 0.9;
        Object.assign(body, extraProps);
        return body;
      });
      return bodies;
    }

    // Stop simulation after 5 seconds so that we don't use up CPU unneccessarily
    setTimeout(() => {
      Runner.stop(runner);
      Render.stop(render);
    }, 5000);

    return () => {
      Engine.clear(engine);
      Render.stop(render);
      Runner.stop(runner);
      document.querySelector("canvas").remove();
    };
  };
  let deleteSimulation;
  document.addEventListener("DOMContentLoaded", async () => {
    deleteSimulation = await runSimulation();
  });

  document
    .querySelector(".name-container")
    .addEventListener("click", async () => {
      deleteSimulation?.();
      deleteSimulation = await runSimulation();
    });
</script>

<script src="./posthog_embed.js"></script>
